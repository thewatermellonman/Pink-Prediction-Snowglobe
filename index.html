<!DOCTYPE html> <html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>My pink snowglobe</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header class="hero">
            <h1>My pink snowglobe</h1>
            <p>A snowglobe, but pinker</p>
        </header>
        <main>
            <section class="globe-card">
                <div class="globe" id="globe">
                    <img class="scene" src="snowglobe.png" alt="a pretty pink snowglobe" />
                </div>
                <button id="shake">shake the globe</button>
                <p class="message" id="message">press the button and see what settles</p>
            </section>
        </main>
        <footer>
            <p>made by me :D</p>
        </footer>
        <script src="script.js"></script>
    </body>
</html>
