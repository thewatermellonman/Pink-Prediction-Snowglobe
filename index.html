<!DOCTYPE html> <html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>The Pink Prediction Snowglobe</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header class="hero">
            <h1>The Pink Prediction Snowglobe</h1>
            <p>A snowglobe, but pinker and better at predicting things</p>
        </header>
        <main>
            <section class="globe-card">
                <div class="globe" id="globe">
                    <img class="scene" src="snowglobe.png" alt="a pretty pink snowglobe" />
                </div>

                <p class="message" id="message">
                    ask the snowglobe a question and see how your future will unfold...
                </p>

                <div class="question-area">
                    <label for="question">what do you want to know?</label>
                    <input type="text" id="question" placeholder="ask me anything..." maxlength="100" />
                    <button id="ask">ask the snowglobe</button>
                </div>
            </section>
        </main>
        <footer>
            <p>made by me :D</p>
        </footer>
        <script src="script.js"></script>
    </body>
</html>
